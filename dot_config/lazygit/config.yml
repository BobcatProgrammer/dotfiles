# lazygit configuration — ~/.config/lazygit/config.yml
# Managed by chezmoi (dot_config/lazygit/config.yml).
# Catppuccin Mocha theme: https://catppuccin.com

gui:
  theme:
    lightTheme: false
    activeBorderColor:
      - "#cba6f7"
      - bold
    inactiveBorderColor:
      - "#6c7086"
    optionsTextColor:
      - "#89b4fa"
    selectedLineBgColor:
      - "#313244"
    cherryPickedCommitBgColor:
      - "#45475a"
    cherryPickedCommitFgColor:
      - "#cba6f7"
    unstagedChangesColor:
      - "#f38ba8"
    defaultFgColor:
      - "#cdd6f4"
    searchingActiveBorderColor:
      - "#a6e3a1"
  border: rounded
  showFileTree: true
  showCommandLog: false
