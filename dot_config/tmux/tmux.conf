set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

unbind C-b
set -g prefix C-Space
bind-key C-Space send-prefix

unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

set -g mouse on

bind -n S-down new-window
bind -n S-left prev
bind -n S-right next

# tpm plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
set -g @plugin 'catppuccin/tmux#2.1.3'
set -g @plugin '2kabhishek/tmux2k'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'alexwforsythe/tmux-which-key'

# ── tmux2k status bar ─────────────────────────────────────────────────────────
set -g @tmux2k-theme 'catppuccin'
set -g @tmux2k-icons-only true
# Powerline arrows for status bar plugins (line 1)
# @tmux2k-show-powerline + @tmux2k-force-powerline bypass the icons-only lockout
set -g @tmux2k-show-powerline true
set -g @tmux2k-force-powerline true

# Left: session name, git branch/status, current directory
set -g @tmux2k-left-plugins "session git cwd"

# Right: grouped system stats, github notifications, clock
set -g @tmux2k-right-plugins "group1 github time"

# Group 1: cpu | ram | battery in a single compact block
set -g @tmux2k-group1-plugins "cpu ram battery"
set -g @tmux2k-group1-delimiter " | "
set -g @tmux2k-group1-colors "orange text"       # peach/orange #f5a97f
set -g @tmux2k-github-colors "light_purple text" # mauve #c6a0f6
set -g @tmux2k-time-colors "light_blue text"     # sky #91d7e3 (default, explicit)
# disable decimal so cpu uses same 4-char padding as ram (e.g. " 26%" not "  26%")
set -g @tmux2k-cpu-usage-decimal false

# git: show branch + file change counts
set -g @tmux2k-git-display-status true

# Clock: 24h format
set -g @tmux2k-time-format "%a %H:%M"

# Window name: #id + name + [cwd], auto-updates when changing directory
set -g @tmux2k-window-list-format "#I:#W [#{b:pane_current_path}]"
set -g automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"

# ── Two-line status bar ────────────────────────────────────────────────────────
# Line 0 (top):  window list only — full width, left-aligned
# Line 1 (bottom): left plugins (session/git/cwd) + right plugins (group1/github/time)
set -g status 2

# Line 0: window list, full width, bg matches tmux2k catppuccin bg_main (#1e2030)
set -g status-format[0] "#[bg=#1e2030,fg=default]#[list=on align=left]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{window-status-separator}}}#[nolist]"

# Line 1: left plugins + right plugins (tmux2k populates status-left and status-right)
set -g status-format[1] "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"

# ── which-key: open action menu with prefix + Space ───────────────────────────
# config.yaml lives in the plugin directory (plugins/tmux-which-key/config.yaml)

# ── session persistence ────────────────────────────────────────────────────────
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-boot-options 'alacritty'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
# seps.conf is generated by python3 to embed Nerd Font arrow glyphs (U+E0B0, U+E0B2)
# source runs synchronously, so tmux2k reads the correct values when TPM fires.
source-file ~/.config/tmux/seps.conf
run '~/.config/tmux/plugins/tpm/tpm'

# ── Window tab styling (overrides tmux2k flat-mode defaults) ──────────────────
# Active window:   Catppuccin blue bg  (#8aadf4) + dark text (#1e2030)
# Inactive window: Subtle lifted bg   (#2d3248)  + white text (#cad3f5)
# run-shell fires after TPM (run is async; run-shell queues after it)
run-shell '~/.config/tmux/window-style.sh'
